name: Check Environment

on:
  push:
    branches: '**'
    # ドキュメントだけの変更では環境に影響しないため動かさない（ほかのファイルも変わっていれば動く）
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'img/**'
      - 'LICENCE'

jobs:
  run_post_create_command:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable  # 使用する Rust のバージョンを指定
        # デフォルトの rustup override は rust-toolchain より優先され、以降の cargo が 1.89.0 にならないため無効にする
        override: false

    - name: Run postCreateCommand.bash
      run: |
        bash .devcontainer/postCreateCommand.bash
    - name: check python for stress test
      run: python3.15 --version
    - name: check cargo-compete
      continue-on-error: true
      run: |
        cargo compete new abc325
        sed -i 's/^edition = "2021"$/edition = "2024"/' abc325/Cargo.toml
        cargo member include abc325
        pwd
        cat .github/ciabc325a.rs > abc325/src/bin/a.rs
        cd abc325/src/bin/
        cargo build --bin abc325-a
        cargo compete test a
    - name: check formatter
      run: cargo fmt